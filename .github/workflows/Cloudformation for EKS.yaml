name: EKS Stack Creation Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'EKS-Cloudformation.yaml'
      - '.github/workflows/eks-stack-creation.yaml'
  workflow_dispatch:
    inputs:
      stack_action:
        description: 'Stack action (create/update/delete)'
        required: true
        default: 'create'
        type: choice
        options:
          - create
          - update
          - delete
#      environment:
#        description: 'Environment name'
#        required: true
#        default: 'dev'
#        type: choice
#        options:
#          - dev
#          - staging
#          - prod

env:
  AWS_REGION: us-east-2
  STACK_NAME: my-eks-cluster-stack
  CF_TEMPLATE_FILE: EKS-Cloudformation.yaml

jobs:
  validate:
    name: Validate CloudFormation Template
    runs-on: ubuntu-latest
    # Skip validation for delete operations
    if: ${{ github.event.inputs.stack_action != 'delete' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate CloudFormation template
        run: |
          echo "Validating CloudFormation template: ${{ env.CF_TEMPLATE_FILE }}"
          aws cloudformation validate-template \
            --template-body file://${{ env.CF_TEMPLATE_FILE }} \
            --region ${{ env.AWS_REGION }}
          echo "✅ Template validation passed"

  preview:
    name: Preview Stack Changes
    runs-on: ubuntu-latest
    needs: validate
    # Skip preview for delete operations
    if: ${{ github.event.inputs.stack_action != 'delete' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check if stack exists
        id: check_stack
        run: |
          if aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "stack_exists=true" >> $GITHUB_OUTPUT
          else
            echo "stack_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Preview create/update
        run: |
          echo "Stack Status: ${{ steps.check_stack.outputs.stack_exists }}"
          if [ "${{ steps.check_stack.outputs.stack_exists }}" = "true" ]; then
            echo "🔄 Stack exists - will perform UPDATE operation"
            aws cloudformation get-template-summary \
              --stack-name ${{ env.STACK_NAME }} \
              --region ${{ env.AWS_REGION }} || echo "Could not retrieve template"
          else
            echo "✨ Stack does not exist - will perform CREATE operation"
          fi

  deploy:
    name: Deploy EKS Stack
    runs-on: ubuntu-latest
    needs: [validate, preview]
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy/Update Stack
        id: deploy
        # Skip this step if delete action is selected
        if: ${{ github.event.inputs.stack_action != 'delete' }}
        run: |
          STACK_ACTION=""
          
          if aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} 2>/dev/null; then
            STACK_ACTION="update-stack"
            echo "action=update" >> $GITHUB_OUTPUT
          else
            STACK_ACTION="create-stack"
            echo "action=create" >> $GITHUB_OUTPUT
          fi
          
          echo "Performing $STACK_ACTION for stack: ${{ env.STACK_NAME }}"
          
          aws cloudformation $STACK_ACTION \
            --stack-name ${{ env.STACK_NAME }} \
            --template-body file://${{ env.CF_TEMPLATE_FILE }} \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM
          
          STACK_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].StackId' \
            --output text)
          
          echo "stack_id=$STACK_ID" >> $GITHUB_OUTPUT

      - name: Delete Stack
        id: delete
        # Only run this step if delete action is selected
        if: ${{ github.event.inputs.stack_action == 'delete' }}
        run: |
          echo "🗑️ Deleting CloudFormation stack: ${{ env.STACK_NAME }}"
          
          if aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} 2>/dev/null; then
            
            aws cloudformation delete-stack \
              --stack-name ${{ env.STACK_NAME }} \
              --region ${{ env.AWS_REGION }}
            
            echo "action=delete" >> $GITHUB_OUTPUT
            echo "✅ Delete request submitted"
          else
            echo "⚠️ Stack does not exist"
            echo "action=delete-not-found" >> $GITHUB_OUTPUT
          fi

      - name: Wait for Stack Completion
        run: |
          echo "⏳ Waiting for stack operation to complete..."
          
          DEPLOY_ACTION="${{ steps.deploy.outputs.action }}"
          DELETE_ACTION="${{ steps.delete.outputs.action }}"
          
          if [ "$DEPLOY_ACTION" = "create" ]; then
            aws cloudformation wait stack-create-complete \
              --stack-name ${{ env.STACK_NAME }} \
              --region ${{ env.AWS_REGION }}
            echo "✅ Stack creation completed successfully"
          elif [ "$DEPLOY_ACTION" = "update" ]; then
            aws cloudformation wait stack-update-complete \
              --stack-name ${{ env.STACK_NAME }} \
              --region ${{ env.AWS_REGION }} || echo "⚠️ No updates to be performed"
            echo "✅ Stack update completed"
          elif [ "$DELETE_ACTION" = "delete" ]; then
            aws cloudformation wait stack-delete-complete \
              --stack-name ${{ env.STACK_NAME }} \
              --region ${{ env.AWS_REGION }}
            echo "✅ Stack deletion completed successfully"
          elif [ "$DELETE_ACTION" = "delete-not-found" ]; then
            echo "⚠️ Stack deletion skipped - stack not found"
          fi

  validate-deployment:
    name: Validate Deployment
    runs-on: ubuntu-latest
    needs: deploy
    # Skip validation if delete action is selected or deployment failed
    if: ${{ success() && github.event.inputs.stack_action != 'delete' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Stack Outputs
        id: stack_info
        run: |
          echo "📋 Stack Information:"
          aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].{StackId:StackId,Status:StackStatus,CreationTime:CreationTime}' \
            --output table
          
          echo ""
          echo "📤 Stack Outputs:"
          aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table || echo "No outputs available"

      - name: Validate EKS Cluster
        run: |
          echo "🔍 Validating EKS Cluster..."
          CLUSTER_NAME=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`ClusterName`].OutputValue' \
            --output text)
          
          if [ -z "$CLUSTER_NAME" ]; then
            echo "⚠️ Could not retrieve cluster name"
          else
            echo "Cluster Name: $CLUSTER_NAME"
            aws eks describe-cluster \
              --name "$CLUSTER_NAME" \
              --region ${{ env.AWS_REGION }} \
              --query 'cluster.{Name:name,Status:status,Version:version,Endpoint:endpoint}' \
              --output table || echo "Cluster still initializing..."
          fi

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy
    # Skip rollback for delete operations
    if: ${{ failure() && github.event.inputs.stack_action != 'delete' }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Continue Stack Rollback
        run: |
          echo "❌ Deployment failed. Initiating rollback..."
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].StackStatus' \
            --output text)
          
          echo "Current Stack Status: $STACK_STATUS"
          
          if [[ "$STACK_STATUS" == *"ROLLBACK"* ]] || [[ "$STACK_STATUS" == *"IN_PROGRESS"* ]]; then
            echo "Stack is already rolling back or in progress"
          else
            echo "Stack will automatically rollback if creation/update failed"
          fi

  notification:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [deploy, validate-deployment]
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "🚀 EKS Stack Deployment Summary"
          echo "================================"
          echo "Stack Name: ${{ env.STACK_NAME }}"
          echo "Region: ${{ env.AWS_REGION }}"
          echo "Action: ${{ github.event.inputs.stack_action || 'auto-deploy' }}"
          echo "Status: ${{ job.status }}"
          echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo ""
          
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Operation completed successfully!"
          else
            echo "❌ Operation failed. Please check the logs above."
          fi
