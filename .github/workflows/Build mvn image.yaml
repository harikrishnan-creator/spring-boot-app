name: build image

on:
  workflow_dispatch: 

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: employee-app

jobs:
  build-and-deploy:
    runs-on: self-hosted

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

#      - name: Setup JDK 25
#        uses: actions/setup-java@v4
#        with:
#          java-version: '25'
#         distribution: 'temurin'

      - name: Maven Build & Test
        run: mvn clean package

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::675344694125:role/github_oidc-role

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t $ECR_REPOSITORY:${{ github.sha }} -f Docker .

      - name: Tag image for ECR
        run: |
         docker tag employee-app:latest 675344694125.dkr.ecr.us-east-2.amazonaws.com/employee-app:latest

      - name: Push image to ECR
        run: |
         docker push 675344694125.dkr.ecr.us-east-2.amazonaws.com/employee-app:latest

      - name: Move build to S3      
        run: |
          aws s3 cp target/employee-service-1.0.0.jar s3://mvn-artifact/maven-snapshots/

      - name: Cleanup Target Folder     
        run: |
          rm -rf target    

          
         
