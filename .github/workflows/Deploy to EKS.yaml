name: Deploy to EKS

on:
  workflow_dispatch: 

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: employee-app
  EKS_CLUSTER: my-eks-cluster
  NAMESPACE: default

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull Docker Image from ECR
        run: |
          docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

#      - name: Scan Image with Trivy
#        uses: aquasecurity/trivy-action@master
#        with:
#          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
#         format: table
#          exit-code: 1
#          ignore-unfixed: true
#          severity: CRITICAL,HIGH
#          scanners: vuln 
#          cache: true

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
          --region $AWS_REGION \
          --name $EKS_CLUSTER          

      - name: Replace Image in Manifest
        run: |
          IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

          sed -i "s|IMAGE_PLACEHOLDER|$IMAGE_URI|g" kubernetes-manifest.yaml

      - name: Deploy to EKS
        run: |
          kubectl apply -f kubernetes-manifest.yaml

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/springboot-app 

      - name: Check Pods health
        run: |
          kubectl get pods -n $NAMESPACE
          kubectl get svc -n $NAMESPACE
